<script>
(function(){
  "use strict";
  var c=document.getElementById("rain"), x=c.getContext("2d");
  // hardware-hacking themed glyphs: hex, binary, and bus/logic symbols
  var G="0123456789ABCDEF<>/\|=+*-#01x".split("");
  var fs=16, cols=0, drop=[];
  function size(){
    c.width=innerWidth; c.height=innerHeight;
    cols=Math.ceil(c.width/fs);
    drop=new Array(cols);
    for(var i=0;i<cols;i++) drop[i]=Math.floor(Math.random()*-40);
  }
  function frame(){
    // translucent black each frame leaves fading trails
    x.fillStyle="rgba(5,6,5,0.08)"; x.fillRect(0,0,c.width,c.height);
    x.font=fs+"px "+getComputedStyle(document.body).fontFamily;
    for(var i=0;i<cols;i++){
      var ch=G[(Math.random()*G.length)|0], py=drop[i]*fs;
      // leading glyph brighter than the trail
      x.fillStyle = Math.random()<0.015 ? "#d8ffe4" : "#35c15e";
      x.fillText(ch, i*fs, py);
      if(py>c.height && Math.random()>0.975) drop[i]=Math.floor(Math.random()*-20);
      drop[i]++;
    }
  }
  var timer;
  // Respect prefers-reduced-motion: a CSS media query cannot stop a JS loop,
  // so check it here. We still paint one frame, so the page looks complete
  // rather than showing an empty black canvas.
  var reduce = matchMedia("(prefers-reduced-motion: reduce)");
  function run(){
    clearInterval(timer);
    if(reduce.matches){ frame(); return; }
    timer=setInterval(frame, 52);
  }
  addEventListener("resize", function(){ size(); });
  reduce.addEventListener("change", function(){ size(); run(); });
  size(); run();
  // pause the animation when the tab is hidden (saves battery on mobile)
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearInterval(timer); else run();
  });
})();
</script>
