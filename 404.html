<style>
  :root{ --accent:#35c15e; --accent-text:#6fe08f; --bg:#050605; --text:#e4e4e4; --dim:#8a8a8a;

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--mono);
    overflow:hidden; display:flex; align-items:center; justify-content:center; }

    max-width:560px; width:100%; }
  .logo{ width:300px; max-width:72vw; height:auto; margin:0 auto 34px;
    filter:drop-shadow(0 0 22px rgba(53,193,94,.25)); }
  .code{ font-size:clamp(84px,22vw,168px); font-weight:700; line-height:.9;
    letter-spacing:.04em; margin:0;
    color:var(--accent-text); text-shadow:0 0 26px rgba(53,193,94,.55),0 0 2px rgba(53,193,94,.9); }
  .msg{ font-size:14px; color:var(--dim); margin:18px auto 4px; letter-spacing:.03em; }
  .msg b{ color:var(--text); font-weight:600; }
  .home{ display:inline-block; margin-top:26px; font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:#061207; background:var(--accent);
    padding:11px 22px; border-radius:5px; text-decoration:none; font-weight:600; }
  .home:hover{ background:var(--accent-text); }
  .scan{ position:fixed; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 4px);
    mix-blend-mode:multiply; }
  @media (max-width:480px){ .logo{ margin-bottom:24px; } .msg{ font-size:13px; } }
</style>

<script>
(function(){
  "use strict";
  var c=document.getElementById("rain"), x=c.getContext("2d");
  // hardware-hacking themed glyphs: hex, binary, and bus/logic symbols
  var G="0123456789ABCDEF<>/\|=+*-#01x".split("");
  var fs=16, cols=0, drop=[];
  function size(){
    c.width=innerWidth; c.height=innerHeight;
    cols=Math.ceil(c.width/fs);
    drop=new Array(cols);
    for(var i=0;i<cols;i++) drop[i]=Math.floor(Math.random()*-40);
  }
  function frame(){
    // translucent black each frame leaves fading trails
    x.fillStyle="rgba(5,6,5,0.08)"; x.fillRect(0,0,c.width,c.height);
    x.font=fs+"px "+getComputedStyle(document.body).fontFamily;
    for(var i=0;i<cols;i++){
      var ch=G[(Math.random()*G.length)|0], py=drop[i]*fs;
      // leading glyph brighter than the trail
      x.fillStyle = Math.random()<0.015 ? "#d8ffe4" : "#35c15e";
      x.fillText(ch, i*fs, py);
      if(py>c.height && Math.random()>0.975) drop[i]=Math.floor(Math.random()*-20);
      drop[i]++;
    }
  }
  var timer;
  function run(){ clearInterval(timer); timer=setInterval(frame, 52); }
  addEventListener("resize", function(){ size(); });
  size(); run();
  // pause the animation when the tab is hidden (saves battery on mobile)
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearInterval(timer); else run();
  });
})();
</script>
